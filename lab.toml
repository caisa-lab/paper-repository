alignment = "AI alignment & safety"
robustness = "Robustness & evaluation"
reasoning = "Reasoning & planning"
empathy = "Empathy & emotion"
mental-health = "Mental health"
health = "Health & biomedical NLP"
misinformation = "Misinformation, framing & bias"
social-media = "Social media & computational social science"
personalization = "Personalization & perspectivism"
multilingual = "Multilingual & low-resource NLP"
speech = "Speech & dialects"
dialogue = "Conversational AI & dialogue"
agents = "LLM agents & social simulation"

# Lab configuration used by scripts/bibtool.py and the publication browser.
#
# [[member]] entries: everyone whose papers count as lab output (see AGENTS.md, "What counts").
#   name     – canonical display name, exactly as it should appear on the website
#   aliases  – other spellings found in author lists (accents and punctuation are ignored
#              automatically, so only add genuinely different variants)
#   role     – pi | group-leader | postdoc | phd | researcher | master | student-assistant | lab-student | bachelor
#   groups   – "caisa" (CAISA / Data & Language Technologies Lab) and/or "mai-alignment"
#   status   – current | alumni
#   since / until – approximate years of lab membership (used to judge which papers count)
#
# Sources for the cold start (Sep 2026): caisa-lab.github.io/team, mai-alignment.github.io/team,
# and the members' Google Scholar profiles. Years marked "approx" are best guesses — please fix.

